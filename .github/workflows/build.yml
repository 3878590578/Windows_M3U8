name: Build Windows EXE

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --clean --name "Windows_M3U8_提取器" "Windows_M3U8_提取器.py"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows_M3U8_提取器
          path: dist/Windows_M3U8_提取器.exe
