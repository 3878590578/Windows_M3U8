name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        working-directory: Android
        run: |
          gradle assembleDebug --no-daemon

      - name: Check APK
        working-directory: Android
        run: |
          echo "=============================="
          echo "APK 文件："
          echo "=============================="
          find app/build/outputs/apk/debug -type f -name "*.apk" -print

          echo ""
          echo "=============================="
          echo "APK 大小："
          echo "=============================="
          ls -lh app/build/outputs/apk/debug/*.apk

          echo ""
          echo "=============================="
          echo "APK 字节数："
          echo "=============================="
          stat -c "%n %s bytes" app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M3U8-Extractor-Android
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
