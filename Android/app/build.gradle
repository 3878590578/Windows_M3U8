plugins {
    id 'com.android.application'
}

android {
    namespace 'com.m3u8.extractor'
    compileSdk 35

    defaultConfig {
        applicationId "com.m3u8.extractor"
        minSdk 23
        targetSdk 35

        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false

            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }
}
